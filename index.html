<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리산테크 기술지원팀 현장 자재 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Compat 버전) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col pb-10">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg font-black tracking-wider text-sm">LISAN</div>
        <div>
          <h1 class="text-base md:text-lg font-bold leading-tight">기술지원팀 현장 자재 사용 기록</h1>
          <p class="text-xs text-slate-400 flex items-center gap-1.5">
            <span id="syncStatus" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
            <span id="syncText">클라우드 동기화 연결 중...</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-semibold px-3 py-2 rounded-lg shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-plus"></i>
          <span>작업/자재 등록</span>
        </button>
      </div>
    </div>

    <!-- 네비게이션 탭 -->
    <div class="bg-slate-800 border-t border-slate-700">
      <div class="max-w-7xl mx-auto px-4 flex gap-4 text-xs md:text-sm">
        <button onclick="switchTab('cal')" id="tab-cal" class="py-2.5 px-2 border-b-2 border-blue-500 text-white font-bold flex items-center gap-1.5">
          <i class="fa-regular fa-calendar-days"></i> 캘린더
        </button>
        <button onclick="switchTab('list')" id="tab-list" class="py-2.5 px-2 border-b-2 border-transparent text-slate-400 hover:text-white font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-list-check"></i> 일자별 내역
        </button>
        <button onclick="switchTab('summary')" id="tab-summary" class="py-2.5 px-2 border-b-2 border-transparent text-slate-400 hover:text-white font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-chart-pie"></i> 월간 총 사용량 (1일~말일)
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 mt-4 w-full flex-1">
    
    <!-- 캘린더 뷰 -->
    <section id="view-cal" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3 bg-slate-50">
        <div class="flex items-center gap-2">
          <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="currentMonthLabel" class="text-base md:text-lg font-bold text-slate-800 min-w-[120px] text-center">2026년 11월</span>
          <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <button onclick="goToday()" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1.5 rounded-md font-semibold text-slate-700 ml-1">오늘</button>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-48">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderCalendar()" placeholder="현장명/자재 검색" class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-7 border-b border-slate-200 text-center font-bold text-xs py-2 bg-slate-100 text-slate-600">
        <div class="text-rose-500">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="text-blue-500">토</div>
      </div>

      <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr bg-slate-200 gap-px">
        <!-- 동적 캘린더 -->
      </div>
    </section>

    <!-- 일자별 내역 뷰 -->
    <section id="view-list" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200">
        <h2 class="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
          <i class="fa-solid fa-list text-blue-600"></i> 일자별 작업 및 자재 등록 상세
        </h2>
        <button onclick="downloadCSV('detail')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
          <i class="fa-solid fa-file-excel"></i> 내역 엑셀 다운로드
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold">
              <th class="p-2.5">날짜</th>
              <th class="p-2.5">출동팀</th>
              <th class="p-2.5">현장명</th>
              <th class="p-2.5">사용 자재 목록</th>
              <th class="p-2.5">비고</th>
              <th class="p-2.5 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="detailListBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- 월간 총 사용량 집계 뷰 -->
    <section id="view-summary" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-wrap justify-between items-center gap-2 mb-4 pb-2 border-b border-slate-200">
        <div>
          <h2 class="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
            <i class="fa-solid fa-calculator text-blue-600"></i> 월간 자재 총 사용량 집계 (1일 ~ 말일)
          </h2>
          <p id="summarySubTitle" class="text-xs text-slate-500 mt-0.5">선택된 월 동안 현장에 투입된 총 자재 수량입니다.</p>
        </div>
        <button onclick="downloadCSV('summary')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
          <i class="fa-solid fa-file-excel"></i> 집계 엑셀 다운로드
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold">
              <th class="p-2.5 text-center w-12">순위</th>
              <th class="p-2.5">품목명</th>
              <th class="p-2.5">규격 / 모델명</th>
              <th class="p-2.5 text-right font-black text-blue-600">총 사용 수량</th>
              <th class="p-2.5 text-center">단위</th>
              <th class="p-2.5 text-center">출동 건수</th>
              <th class="p-2.5">사용 현장</th>
            </tr>
          </thead>
          <tbody id="summaryListBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 등록 및 수정 모달 -->
  <div id="recordModal" class="fixed inset
