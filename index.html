<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리산테크 기술지원팀 현장 자재 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Compat 버전) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col pb-10">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg font-black tracking-wider text-sm">LISAN</div>
        <div>
          <h1 class="text-base md:text-lg font-bold leading-tight">기술지원팀 현장 자재 사용 기록</h1>
          <p class="text-xs text-slate-400 flex items-center gap-1.5">
            <span id="syncStatus" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
            <span id="syncText">클라우드 동기화 연결 중...</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-semibold px-3 py-2 rounded-lg shadow flex items-center gap-1.5 transition cursor-pointer">
          <i class="fa-solid fa-plus"></i>
          <span>작업/자재 등록</span>
        </button>
      </div>
    </div>

    <!-- 네비게이션 탭 -->
    <div class="bg-slate-800 border-t border-slate-700">
      <div class="max-w-7xl mx-auto px-4 flex gap-4 text-xs md:text-sm">
        <button type="button" onclick="switchTab('cal')" id="tab-cal" class="py-2.5 px-2 border-b-2 border-blue-500 text-white font-bold flex items-center gap-1.5">
          <i class="fa-regular fa-calendar-days"></i> 캘린더
        </button>
        <button type="button" onclick="switchTab('list')" id="tab-list" class="py-2.5 px-2 border-b-2 border-transparent text-slate-400 hover:text-white font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-list-check"></i> 일자별 내역
        </button>
        <button type="button" onclick="switchTab('summary')" id="tab-summary" class="py-2.5 px-2 border-b-2 border-transparent text-slate-400 hover:text-white font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-chart-pie"></i> 월간 총 사용량 (1일~말일)
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 mt-4 w-full flex-1">
    
    <!-- 캘린더 뷰 -->
    <section id="view-cal" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3 bg-slate-50">
        <div class="flex items-center gap-2">
          <button type="button" onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="currentMonthLabel" class="text-base md:text-lg font-bold text-slate-800 min-w-[120px] text-center">2026년 11월</span>
          <button type="button" onclick="changeMonth(1)" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <button type="button" onclick="goToday()" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1.5 rounded-md font-semibold text-slate-700 ml-1">오늘</button>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-48">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderCalendar()" placeholder="현장명/자재 검색" class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-7 border-b border-slate-200 text-center font-bold text-xs py-2 bg-slate-100 text-slate-600">
        <div class="text-rose-500">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="text-blue-500">토</div>
      </div>

      <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr bg-slate-200 gap-px">
        <!-- 캘린더 동적 생성 -->
      </div>
    </section>

    <!-- 일자별 내역 뷰 -->
    <section id="view-list" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200">
        <h2 class="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
          <i class="fa-solid fa-list text-blue-600"></i> 일자별 작업 및 자재 등록 상세
        </h2>
        <button type="button" onclick="downloadCSV('detail')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
          <i class="fa-solid fa-file-excel"></i> 내역 엑셀 다운로드
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold">
              <th class="p-2.5">날짜</th>
              <th class="p-2.5">출동팀</th>
              <th class="p-2.5">현장명</th>
              <th class="p-2.5">사용 자재 목록</th>
              <th class="p-2.5">비고</th>
              <th class="p-2.5 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="detailListBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- 월간 총 사용량 집계 뷰 -->
    <section id="view-summary" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-wrap justify-between items-center gap-2 mb-4 pb-2 border-b border-slate-200">
        <div>
          <h2 class="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
            <i class="fa-solid fa-calculator text-blue-600"></i> 월간 자재 총 사용량 집계 (1일 ~ 말일)
          </h2>
          <p id="summarySubTitle" class="text-xs text-slate-500 mt-0.5">선택된 월 동안 현장에 투입된 총 자재 수량입니다.</p>
        </div>
        <button type="button" onclick="downloadCSV('summary')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
          <i class="fa-solid fa-file-excel"></i> 집계 엑셀 다운로드
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold">
              <th class="p-2.5 text-center w-12">순위</th>
              <th class="p-2.5">품목명</th>
              <th class="p-2.5">규격 / 모델명</th>
              <th class="p-2.5 text-right font-black text-blue-600">총 사용 수량</th>
              <th class="p-2.5 text-center">단위</th>
              <th class="p-2.5 text-center">출동 건수</th>
              <th class="p-2.5">사용 현장</th>
            </tr>
          </thead>
          <tbody id="summaryListBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 등록 및 수정 모달 -->
  <div id="recordModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden my-6 border border-slate-100">
      <div class="bg-slate-900 text-white px-5 py-3.5 flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-sm md:text-base flex items-center gap-2">
          <i class="fa-solid fa-wrench text-blue-400"></i> 현장 작업 및 자재 사용 등록
        </h3>
        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white text-lg transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="recordForm" onsubmit="saveRecord(event)" class="p-5 space-y-4 text-xs md:text-sm max-h-[80vh] overflow-y-auto">
        <input type="hidden" id="editRecordId">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">작업 일자 *</label>
            <input type="date" id="recordDate" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-blue-500">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">출동팀 *</label>
            <input type="text" id="recordTeam" required placeholder="팀명 입력" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">현장명 *</label>
          <input type="text" id="recordLocation" required placeholder="현장명 입력" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-blue-500">
        </div>

        <!-- 빠른 프리셋 영역 -->
        <div class="border border-blue-100 bg-blue-50/50 rounded-xl p-3">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-slate-700 text-xs flex items-center gap-1.5">
              <i class="fa-solid fa-bolt text-amber-500"></i> 빠른 자재 추가
            </span>
            <button type="button" onclick="openPresetManageModal()" class="text-[11px] text-blue-600 hover:underline flex items-center gap-1">
              <i class="fa-solid fa-gear"></i> 프리셋 수정/관리
            </button>
          </div>
          <div id="quickPresetContainer" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1"></div>
        </div>

        <!-- 사용 자재 입력 목록 -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="font-semibold text-slate-700">사용한 자재 목록 *</label>
            <button type="button" onclick="addMaterialRow()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-plus-circle"></i> 품목 직접 추가
            </button>
          </div>
          <div id="materialRows" class="space-y-2"></div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">작업 내용 및 비고</label>
          <textarea id="recordNote" rows="2" placeholder="작업 상세 및 특이사항을 입력하세요." class="w-full p-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-blue-500 text-xs"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 transition">취소</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-check"></i> 저장
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 프리셋 관리 모달 -->
  <div id="presetManageModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
      <div class="bg-slate-800 text-white px-4 py-3 flex justify-between items-center">
        <h4 class="font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-400"></i> 자재 프리셋 관리
        </h4>
        <button type="button" onclick="closePresetManageModal()" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 space-y-4 text-xs">
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2">
          <div class="font-bold text-slate-700">새 프리셋 추가</div>
          <div class="grid grid-cols-3 gap-1.5">
            <input type="text" id="newPresetName" placeholder="품목명(예:LTQ-100)" class="p-1.5 border border-slate-300 rounded col-span-2">
            <input type="text" id="newPresetUnit" placeholder="단위(EA)" value="EA" class="p-1.5 border border-slate-300 rounded">
          </div>
          <input type="text" id="newPresetSpec" placeholder="규격/모델(예:2CH PLC모뎀)" class="w-full p-1.5 border border-slate-300 rounded">
          <button type="button" onclick="addNewPreset()" class="w-full bg-blue-600 text-white font-bold py-1.5 rounded hover:bg-blue-500 transition">추가하기</button>
        </div>

        <div>
          <div class="font-bold text-slate-700 mb-1.5">현재 등록된 프리셋 (<span id="presetCount">0</span>개)</div>
          <div id="presetManageList" class="space-y-1 max-h-48 overflow-y-auto pr-1"></div>
        </div>

        <div class="flex justify-between items-center pt-2 border-t border-slate-200">
          <button type="button" onclick="resetDefaultPresets()" class="text-rose-600 hover:underline text-[11px]">기본 프리셋으로 초기화</button>
          <button type="button" onclick="closePresetManageModal()" class="px-3 py-1.5 bg-slate-200 rounded font-bold hover:bg-slate-300">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 자바스크립트 로직 -->
  <script>
    // 1. Firebase 실제 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyADI20UZJNF7Zm1xjuOHNJlju_rMk7zcK8",
      authDomain: "lisantech-4b675.firebaseapp.com",
      databaseURL: "https://lisantech-4b675-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "lisantech-4b675",
      storageBucket: "lisantech-4b675.firebasestorage.app",
      messagingSenderId: "3183928684",
      appId: "1:3183928684:web:8ca72494d516fe9d96ff49"
    };

    let currentDate = new Date();
    let recordsData = [];
    let db = null;

    // 기본 프리셋 (리산테크 실무 라인업)
    const defaultPresets = [
      { name: "LTQ-100", spec: "터널등 모뎀 (100W 2CH)", unit: "EA" },
      { name: "LTQ-200", spec: "터널등 모뎀 (200W)", unit: "EA" },
      { name: "LCM-190K", spec: "통합형 모뎀 (조달용)", unit: "EA" },
      { name: "LSG-3500", spec: "가로등 모뎀", unit: "EA" },
      { name: "TGW-9500", spec: "터널등 제어기 (상하행통합)", unit: "대" },
      { name: "SGW-7000K", spec: "가로등 제어기", unit: "대" },
      { name: "GLUX-200", spec: "터널 수광부 조도센서", unit: "EA" },
      { name: "PLC 커플러", spec: "C형 커플러 (신호증폭)", unit: "EA" },
      { name: "SMPS (파워)", spec: "25W / 75W 컨버터", unit: "EA" },
      { name: "마그네틱(보조계전기)", spec: "MR-4 AC220V", unit: "EA" },
      { name: "동축케이블", spec: "신호 결선용", unit: "M" }
    ];

    let userPresets = JSON.parse(localStorage.getItem('tech_presets')) || defaultPresets;

    // 2. 초기 구동
    function init() {
      renderCalendar();
      renderQuickPresets();
      connectFirebase();
    }

    // 3. Firebase 실시간 연결
    function connectFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();

        db.collection("work_records").onSnapshot((snapshot) => {
          const records = [];
          snapshot.forEach((doc) => {
            records.push({ id: doc.id, ...doc.data() });
          });
          recordsData = records;
          
          const statusEl = document.getElementById('syncStatus');
          const textEl = document.getElementById('syncText');
          if (statusEl) statusEl.className = "inline-block w-2 h-2 rounded-full bg-emerald-400";
          if (textEl) textEl.textContent = `실시간 연동 완료 (${recordsData.length}건)`;
          
          renderCalendar();
          renderDetailList();
          renderSummaryTable();
        }, (error) => {
          console.error("Firestore 수신 에러:", error);
          const statusEl = document.getElementById('syncStatus');
          const textEl = document.getElementById('syncText');
          if (statusEl) statusEl.className = "inline-block w-2 h-2 rounded-full bg-rose-500";
          if (textEl) textEl.textContent = "동기화 권한 오류 (Firebase 보안 규칙 확인 필요)";
        });
      } catch (err) {
        console.error("Firebase 초기화 에러:", err);
        const statusEl = document.getElementById('syncStatus');
        const textEl = document.getElementById('syncText');
        if (statusEl) statusEl.className = "inline-block w-2 h-2 rounded-full bg-rose-500";
        if (textEl) textEl.textContent = "연결 오류: " + err.message;
      }
    }

    // 4. 캘린더 렌더링
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const label = document.getElementById('currentMonthLabel');
      const search = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      if (label) label.textContent = `${year}년 ${month + 1}월`;
      if (!grid) return;
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const d = prevLastDate - i;
        grid.innerHTML += `<div class="bg-slate-50 min-h-[90px] md:min-h-[110px] p-1.5 opacity-40"><span class="text-xs text-slate-400">${d}</span></div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;

        const dayRecords = recordsData.filter(r => {
          if (r.date !== dateStr) return false;
          if (!search) return true;
          const matchLoc = (r.location || '').toLowerCase().includes(search);
          const matchTeam = (r.team || '').toLowerCase().includes(search);
          const matchMat = (r.materials || []).some(m => (m.name + m.spec).toLowerCase().includes(search));
          return matchLoc || matchTeam || matchMat;
        });

        let badgesHtml = '';
        dayRecords.forEach(r => {
          const matCount = (r.materials || []).reduce((sum, m) => sum + Number(m.qty || 0), 0);
          badgesHtml += `
            <div onclick="editRecord('${r.id}')" class="bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900 rounded p-1 mb-1 cursor-pointer transition text-[11px] leading-tight">
              <div class="font-bold truncate flex justify-between">
                <span>${escapeHtml(r.location)}</span>
                <span class="text-[10px] text-blue-600 font-black">${matCount}개</span>
              </div>
              <div class="text-[10px] text-slate-500 truncate">${escapeHtml(r.team)}</div>
            </div>
          `;
        });

        grid.innerHTML += `
          <div class="bg-white min-h-[90px] md:min-h-[110px] p-1.5 flex flex-col justify-between hover:bg-slate-50 transition border-t border-slate-100">
            <div>
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold ${isToday ? 'bg-blue-600 text-white w-5 h-5 rounded-full flex items-center justify-center' : 'text-slate-700'}">${day}</span>
                <button type="button" onclick="openModal('${dateStr}')" class="text-slate-300 hover:text-blue-600 text-xs px-1" title="추가">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
              <div class="space-y-0.5 overflow-y-auto max-h-[75px]">${badgesHtml}</div>
            </div>
          </div>
        `;
      }

      const totalCells = firstDay + lastDate;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= nextDays; i++) {
        grid.innerHTML += `<div class="bg-slate-50 min-h-[90px] md:min-h-[110px] p-1.5 opacity-40"><span class="text-xs text-slate-400">${i}</span></div>`;
      }
    }

    // 5. 일자별 상세 내역
    function renderDetailList() {
      const tbody = document.getElementById('detailListBody');
      if (!tbody) return;
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;

      const currentMonthRecords = recordsData
        .filter(r => (r.date || '').startsWith(prefix))
        .sort((a, b) => b.date.localeCompare(a.date));

      if (currentMonthRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">해당 월에 등록된 현장 기록이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = currentMonthRecords.map(r => {
        const matList = (r.materials || []).map(m => `
          <span class="inline-block bg-slate-100 border border-slate-200 rounded px-1.5 py-0.5 text-[11px] mr-1 mb-1">
            <strong>${escapeHtml(m.name)}</strong> ${m.spec ? `(${escapeHtml(m.spec)})` : ''} 
            <span class="text-blue-600 font-bold">${m.qty}${escapeHtml(m.unit || 'EA')}</span>
          </span>
        `).join('');

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-2.5 font-bold text-slate-700 whitespace-nowrap">${r.date}</td>
            <td class="p-2.5 text-slate-700 whitespace-nowrap font-medium">${escapeHtml(r.team)}</td>
            <td class="p-2.5 font-semibold text-slate-800">${escapeHtml(r.location)}</td>
            <td class="p-2.5">${matList || '<span class="text-slate-400">없음</span>'}</td>
            <td class="p-2.5 text-slate-500 max-w-xs truncate">${escapeHtml(r.note || '-')}</td>
            <td class="p-2.5 text-center whitespace-nowrap">
              <button type="button" onclick="editRecord('${r.id}')" class="text-blue-600 hover:text-blue-800 font-semibold px-1.5">수정</button>
              <button type="button" onclick="deleteRecord('${r.id}')" class="text-rose-600 hover:text-rose-800 font-semibold px-1.5 ml-1">삭제</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 6. 월간 총 사용량 집계
    function renderSummaryTable() {
      const tbody = document.getElementById('summaryListBody');
      if (!tbody) return;
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;

      const subTitle = document.getElementById('summarySubTitle');
      if (subTitle) subTitle.textContent = `${year}년 ${month}월 1일부터 말일까지 현장에 투입된 총 자재 수량 집계입니다.`;

      const monthlyRecords = recordsData.filter(r => (r.date || '').startsWith(prefix));

      const map = {};
      monthlyRecords.forEach(r => {
        (r.materials || []).forEach(m => {
          const key = `${m.name}___${m.spec || ''}___${m.unit || 'EA'}`;
          if (!map[key]) {
            map[key] = {
              name: m.name,
              spec: m.spec || '',
              unit: m.unit || 'EA',
              totalQty: 0,
              sites: new Set(),
              dispatchCount: 0
            };
          }
          map[key].totalQty += Number(m.qty || 0);
          map[key].sites.add(r.location);
          map[key].dispatchCount += 1;
        });
      });

      const summaryList = Object.values(map).sort((a, b) => b.totalQty - a.totalQty);

      if (summaryList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">이번 달 사용된 자재 내역이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = summaryList.map((item, idx) => {
        let rankBadge = `<span class="text-slate-500 font-bold">${idx + 1}</span>`;
        if (idx === 0) rankBadge = `<span class="bg-amber-400 text-amber-950 font-black text-[10px] px-1.5 py-0.5 rounded-full">#1</span>`;
        if (idx === 1) rankBadge = `<span class="bg-slate-300 text-slate-900 font-black text-[10px] px-1.5 py-0.5 rounded-full">#2</span>`;
        if (idx === 2) rankBadge = `<span class="bg-amber-600 text-white font-black text-[10px] px-1.5 py-0.5 rounded-full">#3</span>`;

        const siteTags = Array.from(item.sites).map(s => `
          <span class="inline-block bg-blue-50 text-blue-700 border border-blue-200 rounded px-1.5 py-0.5 text-[10px] mr-1 mb-0.5">${escapeHtml(s)}</span>
        `).join('');

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-2.5 text-center">${rankBadge}</td>
            <td class="p-2.5 font-bold text-slate-800">${escapeHtml(item.name)}</td>
            <td class="p-2.5 text-slate-600">${escapeHtml(item.spec) || '-'}</td>
            <td class="p-2.5 text-right font-black text-sm text-blue-600">${item.totalQty.toLocaleString()}</td>
            <td class="p-2.5 text-center text-slate-600">${escapeHtml(item.unit)}</td>
            <td class="p-2.5 text-center font-semibold text-slate-700">${item.dispatchCount}건</td>
            <td class="p-2.5">${siteTags}</td>
          </tr>
        `;
      }).join('');
    }

    // 7. DB 저장 및 삭제 (빈 행 자동 필터링)
    async function saveRecord(e) {
      e.preventDefault();
      if (!db) {
        alert("데이터베이스 연결 준비 중입니다. 잠시 후 다시 시도해주세요.");
        return;
      }

      const id = document.getElementById('editRecordId').value;
      const date = document.getElementById('recordDate').value;
      const team = document.getElementById('recordTeam').value.trim();
      const location = document.getElementById('recordLocation').value.trim();
      const note = document.getElementById('recordNote').value.trim();

      const matRows = document.querySelectorAll('.mat-row');
      const materials = [];
      matRows.forEach(row => {
        const name = row.querySelector('.mat-name').value.trim();
        const spec = row.querySelector('.mat-spec').value.trim();
        const qty = parseFloat(row.querySelector('.mat-qty').value) || 0;
        const unit = row.querySelector('.mat-unit').value.trim() || 'EA';
        // 품목명이 입력되어 있고 수량이 0보다 큰 것만 골라서 저장 (빈 칸은 자동 무시)
        if (name && qty > 0) {
          materials.push({ name, spec, qty, unit });
        }
      });

      if (materials.length === 0) {
        alert("최소 1개 이상의 자재와 수량을 입력해주세요.");
        return;
      }

      const record = { date, team, location, materials, note, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };

      try {
        if (id) {
          await db.collection("work_records").doc(id).update(record);
        } else {
          await db.collection("work_records").add(record);
        }
        closeModal();
      } catch (err) {
        alert("저장 실패 (Firebase 권한 규칙 확인): " + err.message);
      }
    }

    async function deleteRecord(id) {
      if (!db) return;
      if (!confirm("이 작업 기록을 삭제하시겠습니까? (삭제 시 전 팀원 화면에서도 삭제됩니다)")) return;
      try {
        await db.collection("work_records").doc(id).delete();
      } catch (err) {
        alert("삭제 실패: " + err.message);
      }
    }

    // 8. 모달 제어 및 프리셋 자동 덮어쓰기 로직
    function openModal(defaultDate = null) {
      document.getElementById('recordForm').reset();
      document.getElementById('editRecordId').value = '';
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-wrench text-blue-400"></i> 현장 작업 및 자재 사용 등록`;
      document.getElementById('materialRows').innerHTML = '';

      const targetDate = defaultDate || new Date().toISOString().split('T')[0];
      document.getElementById('recordDate').value = targetDate;

      renderQuickPresets();
      addMaterialRow(); // 초기 1개 행 생성
      document.getElementById('recordModal').classList.remove('hidden');
    }

    function editRecord(id) {
      const record = recordsData.find(r => r.id === id);
      if (!record) return;

      document.getElementById('editRecordId').value = record.id;
      document.getElementById('recordDate').value = record.date;
      document.getElementById('recordTeam').value = record.team;
      document.getElementById('recordLocation').value = record.location;
      document.getElementById('recordNote').value = record.note || '';
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen text-amber-400"></i> 작업 내역 수정`;

      document.getElementById('materialRows').innerHTML = '';
      (record.materials || []).forEach(m => addMaterialRow(m.name, m.spec, m.qty, m.unit));

      renderQuickPresets();
      document.getElementById('recordModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('recordModal').classList.add('hidden');
    }

    function addMaterialRow(name = '', spec = '', qty = 1, unit = 'EA') {
      const container = document.getElementById('materialRows');
      const row = document.createElement('div');
      row.className = 'mat-row grid grid-cols-12 gap-1.5 items-center bg-slate-50 p-2 rounded-lg border border-slate-200';
      row.innerHTML = `
        <div class="col-span-4">
          <input type="text" value="${escapeHtml(name)}" placeholder="품목명" class="mat-name w-full p-1.5 border border-slate-300 rounded text-xs focus:ring-1 focus:ring-blue-500">
        </div>
        <div class="col-span-3">
          <input type="text" value="${escapeHtml(spec)}" placeholder="규격" class="mat-spec w-full p-1.5 border border-slate-300 rounded text-xs">
        </div>
        <div class="col-span-2">
          <input type="number" min="0.1" step="any" value="${qty}" class="mat-qty w-full p-1.5 border border-slate-300 rounded text-xs font-bold text-center">
        </div>
        <div class="col-span-2">
          <input type="text" value="${escapeHtml(unit)}" placeholder="단위" class="mat-unit w-full p-1.5 border border-slate-300 rounded text-xs text-center">
        </div>
        <div class="col-span-1 text-center">
          <button type="button" onclick="this.closest('.mat-row').remove()" class="text-slate-400 hover:text-rose-600 transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `;
      container.appendChild(row);
    }

    function renderQuickPresets() {
      const container = document.getElementById('quickPresetContainer');
      if (!container) return;
      container.innerHTML = userPresets.map(p => `
        <button type="button" onclick="applyPreset('${escapeHtml(p.name)}', '${escapeHtml(p.spec)}', '${escapeHtml(p.unit)}')" 
          class="bg-white hover:bg-blue-600 hover:text-white border border-slate-300 text-slate-700 px-2 py-1 rounded text-[11px] transition">
          + ${escapeHtml(p.name)}
        </button>
      `).join('');
    }

    // 프리셋 클릭 처리 함수
    function applyPreset(name, spec, unit) {
      const rows = document.querySelectorAll('.mat-row');
      
      // 1. 이미 같은 품목이 등록되어 있으면 수량만 +1
      for (let r of rows) {
        const rowName = r.querySelector('.mat-name').value.trim();
        const rowSpec = r.querySelector('.mat-spec').value.trim();
        if (rowName === name && rowSpec === spec) {
          const qtyInput = r.querySelector('.mat-qty');
          qtyInput.value = parseFloat(qtyInput.value || 0) + 1;
          return;
        }
      }

      // 2. 비어있는 직접입력 칸이 남아있다면 새 행을 만들지 않고 그 빈 칸을 프리셋으로 덮어씀
      for (let r of rows) {
        const rowName = r.querySelector('.mat-name').value.trim();
        if (!rowName) {
          r.querySelector('.mat-name').value = name;
          r.querySelector('.mat-spec').value = spec || '';
          r.querySelector('.mat-qty').value = 1;
          r.querySelector('.mat-unit').value = unit || 'EA';
          return;
        }
      }

      // 3. 빈 칸이 전혀 없을 때만 새 행 추가
      addMaterialRow(name, spec, 1, unit);
    }

    // 프리셋 수정 관리
    function openPresetManageModal() {
      renderPresetManageList();
      document.getElementById('presetManageModal').classList.remove('hidden');
    }

    function closePresetManageModal() {
      document.getElementById('presetManageModal').classList.add('hidden');
      renderQuickPresets();
    }

    function renderPresetManageList() {
      const list = document.getElementById('presetManageList');
      const countEl = document.getElementById('presetCount');
      if (countEl) countEl.textContent = userPresets.length;
      if (!list) return;

      list.innerHTML = userPresets.map((p, idx) => `
        <div class="flex justify-between items-center p-1.5 bg-slate-50 border border-slate-200 rounded text-xs">
          <div>
            <span class="font-bold text-slate-800">${escapeHtml(p.name)}</span>
            <span class="text-slate-500">(${escapeHtml(p.spec || '-')})</span>
            <span class="text-blue-600 font-semibold">[${escapeHtml(p.unit)}]</span>
          </div>
          <button type="button" onclick="deletePreset(${idx})" class="text-slate-400 hover:text-rose-600">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      `).join('');
    }

    function addNewPreset() {
      const name = document.getElementById('newPresetName').value.trim();
      const spec = document.getElementById('newPresetSpec').value.trim();
      const unit = document.getElementById('newPresetUnit').value.trim() || 'EA';
      if (!name) return alert("품목명을 입력하세요.");

      userPresets.push({ name, spec, unit });
      localStorage.setItem('tech_presets', JSON.stringify(userPresets));
      document.getElementById('newPresetName').value = '';
      document.getElementById('newPresetSpec').value = '';
      renderPresetManageList();
    }

    function deletePreset(idx) {
      userPresets.splice(idx, 1);
      localStorage.setItem('tech_presets', JSON.stringify(userPresets));
      renderPresetManageList();
    }

    function resetDefaultPresets() {
      if (!confirm("기본 리산테크 부품 프리셋으로 초기화하시겠습니까?")) return;
      userPresets = [...defaultPresets];
      localStorage.setItem('tech_presets', JSON.stringify(userPresets));
      renderPresetManageList();
    }

    // 9. 엑셀(CSV) 다운로드
    function downloadCSV(type) {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      let csv = "\uFEFF";

      if (type === 'detail') {
        csv += "작업일자,출동팀,현장명,품목명,규격,수량,단위,비고\n";
        const monthly = recordsData.filter(r => (r.date || '').startsWith(`${year}-${month}`));
        monthly.forEach(r => {
          (r.materials || []).forEach(m => {
            csv += `"${r.date}","${r.team}","${r.location}","${m.name}","${m.spec || ''}",${m.qty},"${m.unit || 'EA'}","${(r.note || '').replace(/"/g, '""')}"\n`;
          });
        });
      } else {
        csv += "순위,품목명,규격,총사용수량,단위,출동건수,사용현장목록\n";
        const monthly = recordsData.filter(r => (r.date || '').startsWith(`${year}-${month}`));
        const map = {};
        monthly.forEach(r => {
          const k = `${m.name}___${m.spec}___${m.unit}`;
          if (!map[k]) map[k] = { name: m.name, spec: m.spec, unit: m.unit, qty: 0, sites: new Set(), count: 0 };
          map[k].qty += Number(m.qty || 0);
          map[k].sites.add(r.location);
          map[k].count += 1;
        });
      });
      const list = Object.values(map).sort((a, b) => b.qty - a.qty);
      list.forEach((item, idx) => {
        csv += `${idx + 1},"${item.name}","${item.spec}",${item.qty},"${item.unit}",${item.count},"${Array.from(item.sites).join('; ')}"\n`;
      });
    }

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `리산테크_자재_${type === 'detail' ? '일자별내역' : '월간총사용량'}_${year}${month}.csv`;
    link.click();
  }

  function switchTab(tab) {
    ['cal', 'list', 'summary'].forEach(t => {
      document.getElementById(`view-${t}`).classList.add('hidden');
      document.getElementById(`tab-${t}`).className = "py-2.5 px-2 border-b-2 border-transparent text-slate-400 hover:text-white font-medium flex items-center gap-1.5";
    });
    document.getElementById(`view-${tab}`).classList.remove('hidden');
    document.getElementById(`tab-${tab}`).className = "py-2.5 px-2 border-b-2 border-blue-500 text-white font-bold flex items-center gap-1.5";
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
    renderDetailList();
    renderSummaryTable();
  }

  function goToday() {
    currentDate = new Date();
    renderCalendar();
    renderDetailList();
    renderSummaryTable();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
